[project]
name = "photo-sorter"
version = "0.1.0"
description = "Automatic photo/video sorter (DietPi-friendly, no Docker)"
readme = "spec.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Photo Sorter" }]

dependencies = [
  "typer>=0.12",
  "python-dotenv>=1.0",
  "PyYAML>=6.0",
  "pydantic>=2.7",
  "rich>=13.7",
]

[project.scripts]
photo-sorter = "photo_sorter.cli:app"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/photo_sorter"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
addopts = "-q"
